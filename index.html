<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STREETFIND — Achados de Moda</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="logo">STREETFIND</div>

        <button class="menu-button" id="menuButton">
            ☰
        </button>
    </header>


    <!-- MENU -->
    <nav class="menu" id="menu">
        <a href="#">Início</a>
        <a href="#produtos">Produtos</a>
        <a href="#categorias">Categorias</a>
    </nav>


    <!-- HERO -->
    <main>

        <section class="hero">

            <p class="hero-small">SEU ESTILO. SEU ACHADO.</p>

            <h1>
                ENCONTRE<br>
                SEU ESTILO.
            </h1>

            <p class="hero-description">
                Os melhores achados de moda em um só lugar.
            </p>

            <a href="#produtos" class="hero-button">
                EXPLORAR ACHADOS
            </a>

        </section>


        <!-- CATEGORIAS -->
        <section class="categories" id="categorias">

            <div class="section-title">
                <span>CATEGORIAS</span>
            </div>

            <div class="category-list">

                <button>👟 Tênis</button>
                <button>👕 Camisetas</button>
                <button>👖 Calças</button>
                <button>🧥 Jaquetas</button>
                <button>🧢 Acessórios</button>

            </div>

        </section>


        <!-- PRODUTOS -->
        <section class="products" id="produtos">

            <div class="section-title">
                <span>🔥 ACHADINHOS</span>
            </div>

            <div class="product-grid" id="productGrid">

                <!-- Os produtos serão colocados pelo JavaScript -->

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <div class="logo">STREETFIND</div>

        <p>
            Achados de moda selecionados para você.
        </p>

        <small>
            © 2026 STREETFIND
        </small>

    </footer>


    <script src="script.js"></script>

</body>
</html>
